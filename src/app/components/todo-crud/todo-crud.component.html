<h3 class="text-center">This is Todo CRUD Component using NGRX</h3>
<div class="border border-3 rounded-3 p-3 m-3">
  <ol>
    @for (todo of todos$ | async; track $index) {
      <li class="my-2">
        <span [ngStyle]="{ 'text-decoration': todo.isCompleted ? 'line-through' : 'none' }"
          >{{ todo.text }} &nbsp;
          {{ todo.isCompleted }}
          &nbsp;</span
        >
        <button class="btn btn-danger" (click)="deleteMyTodo(todo.id)">Delete</button>
        <button class="btn btn-secondary mx-1" (click)="toggleMyTodo(todo.id)">Toggle</button>
      </li>
    }
  </ol>
  <div class="border border-3 rounded-3 m-3 p-3 align-center">
    <div class="form-row text-center">
      <label style="padding: 20px" for="todoText">Enter the Todo:</label>
      <input id="todoText" type="text" [(ngModel)]="todoText" />
      <button class="btn btn-primary mx-1" (click)="addMyTodo(todoText)">Add Todo</button>
    </div>
  </div>
</div>

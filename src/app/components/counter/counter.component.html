<h3 class="text-center">Counter App using NgRx</h3>

<div class="class border border-3 rounded-3 p-3 m-3">
    <h4>Count: {{count$ | async }}</h4>
    <button class="btn btn-success" (click)="incrementCount()"> Increment </button>
    <button class="btn btn-secondary mx-2" (click)="decrementCount()"> Decrement </button>
    <button class="btn btn-danger" (click)="resetCount()"> Reset </button>
</div>

<div class="container">
  <div class="row">
    <h3>Employee CRUD using NgRX</h3>
    <button class="btn btn-primary" (click)="fetchAllEmployees()">Fetch Employees</button>
    <table class="table table-bordered table-striped">
      <tbody>
        @for (emp of employees$ | async; track $index) {
          <tr>
            <td>{{ emp.id }}</td>
            <td>{{ emp.firstName }}</td>
            <td>{{ emp.lastName }}</td>
            <td>{{ emp.sal }}</td>
            <td>{{ emp.gender }}</td>
            <td>{{ emp.email }}</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
